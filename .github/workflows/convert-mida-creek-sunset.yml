name: Prepare Mida Creek sunset video
on:
  push:
    branches: [main]
    paths:
      - 'IMG_0244.mov'
      - '.github/workflows/convert-mida-creek-sunset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert-sunset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert sunset footage to browser-ready MP4 and generate preview
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='IMG_0244.mov'
          VIDEO='assets/videos/mida-creek-sunset-latest.mp4'
          POSTER='assets/images/mida-creek-sunset-video-poster.jpg'
          test -s "$SOURCE"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p assets/videos assets/images
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$SOURCE" \
            -map 0:v:0 -map '0:a:0?' \
            -vf 'fps=24,scale=960:960:force_original_aspect_ratio=decrease:force_divisible_by=2,setsar=1' \
            -c:v libx264 -preset ultrafast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart "$VIDEO"
          test -s "$VIDEO"
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 2 -i "$VIDEO" \
            -frames:v 1 -vf 'scale=960:960:force_original_aspect_ratio=decrease' -q:v 3 "$POSTER"
          test -s "$POSTER"
      - name: Publish sunset video and poster
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/videos/mida-creek-sunset-latest.mp4 assets/images/mida-creek-sunset-video-poster.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Mida Creek sunset video and preview'
          git pull --rebase origin main
          git push origin HEAD:main
