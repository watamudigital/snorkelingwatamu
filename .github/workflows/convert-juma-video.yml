name: Publish Juma ocean video

on:
  push:
    branches: [main]
    paths:
      - 'assets/videos/IMG_9153.mov'
      - '.github/workflows/convert-juma-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert Juma's uploaded MOV to a browser-compatible MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s "assets/videos/IMG_9153.mov"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "assets/videos/IMG_9153.mov" \
            -map 0:v:0 -map '0:a:0?' \
            -vf "scale=1280:-2:force_original_aspect_ratio=decrease" \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            "assets/videos/juma-ocean-experience.mp4"
          test -s "assets/videos/juma-ocean-experience.mp4"
      - name: Publish the MP4 in the website repository
        shell: bash
        run: |
          set -euo pipefail
          git add -- "assets/videos/juma-ocean-experience.mp4"
          if git diff --cached --quiet; then
            echo "The MP4 is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish optimized Juma ocean video"
          git push origin HEAD:main
