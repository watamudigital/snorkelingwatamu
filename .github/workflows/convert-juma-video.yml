name: Publish Juma ocean video

on:
  push:
    branches: [main]
    paths:
      - 'assets/videos/0433465e-b544-4e72-b7e4-0c6da80fb465.mov'
      - '.github/workflows/convert-juma-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert newest uploaded Juma MOV to browser-compatible MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s "assets/videos/0433465e-b544-4e72-b7e4-0c6da80fb465.mov"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          # Encode the newest user-uploaded MOV with physical pixels in their source
          # orientation, stripping conflicting rotation metadata for browsers.
          SOURCE="assets/videos/0433465e-b544-4e72-b7e4-0c6da80fb465.mov"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height:stream_side_data=rotation -of json "$SOURCE"
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$SOURCE")
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$SOURCE")
          if (( WIDTH > HEIGHT )); then
            FILTER="scale=1280:-2"
          else
            FILTER="scale=720:-2"
          fi
          echo "Input dimensions: ${WIDTH}x${HEIGHT}; using filter: ${FILTER}"
          # Discard rotation metadata; encode the physical pixels upright.
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -noautorotate -display_rotation:v:0 0 \
            -i "$SOURCE" \
            -map 0:v:0 -map '0:a:0?' \
            -vf "$FILTER" \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            "assets/videos/juma-ocean-latest.mp4"
          test -s "assets/videos/juma-ocean-latest.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height:stream_side_data=rotation -of json \
            "assets/videos/juma-ocean-latest.mp4" > /tmp/juma-orientation.json
          python3 - <<'PY'
          import json
          with open('/tmp/juma-orientation.json', encoding='utf-8') as f:
              s = json.load(f)['streams'][0]
          assert s['height'] > 0 and s['width'] > 0, f"Invalid video geometry: {s}"
          rotations = [v['rotation'] for v in s.get('side_data_list', []) if 'rotation' in v]
          assert not rotations or all(float(v) == 0 for v in rotations), f"Unexpected rotation metadata: {rotations}"
          print(f"Verified rotation-free video: {s['width']}x{s['height']}, rotation={rotations or 'none'}")
          PY
      - name: Publish the MP4 in the website repository
        shell: bash
        run: |
          set -euo pipefail
          git add -- "assets/videos/juma-ocean-latest.mp4"
          if git diff --cached --quiet; then
            echo "The MP4 is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish latest Juma video in browser-ready MP4"
          git push origin HEAD:main
