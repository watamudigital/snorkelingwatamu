name: Prepare new Juma homepage hero video

on:
  push:
    branches: [main]
    paths:
      - 'assets/videos/20261105_174122.mov'
      - '.github/workflows/convert-hero-juma-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert newest Juma video for browser autoplay
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='assets/videos/20261105_174122.mov'
          TARGET='assets/videos/juma-hero-latest.mp4'
          POSTER='assets/images/juma-hero-latest-poster.jpg'
          test -s "$SOURCE"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration:stream_side_data=rotation -of json "$SOURCE"
          # Reuse the already oriented 16-second H.264 picture; add the
          # original MOV sound without re-encoding the video or cropping Juma.
          # This makes the correction far faster and preserves image quality.
          AUDIO_TRACKS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$SOURCE" | wc -l)
          echo "Audio tracks in original Juma video: ${AUDIO_TRACKS}"
          if [ "$AUDIO_TRACKS" -lt 1 ]; then
            echo 'ERROR: Original video does not contain an audio track.'
            exit 1
          fi
          test -s "$TARGET"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$TARGET" -i "$SOURCE" \
            -map 0:v:0 -map 1:a:0 -t 16 \
            -c:v copy -c:a aac -b:a 128k -ac 2 \
            -movflags +faststart /tmp/juma-hero-with-audio.mp4
          test -s /tmp/juma-hero-with-audio.mp4
          mv /tmp/juma-hero-with-audio.mp4 "$TARGET"
          test -s "$TARGET"
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 2 -i "$TARGET" \
            -frames:v 1 -vf 'scale=1000:1000:force_original_aspect_ratio=decrease' -q:v 3 "$POSTER"
          test -s "$POSTER"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,side_data_list:format=duration -of json "$TARGET"
          echo 'Audio tracks in source:'
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1 "$SOURCE"
          echo 'Audio tracks in converted video:'
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=noprint_wrappers=1 "$TARGET"
          ls -lh "$SOURCE" "$TARGET" "$POSTER"
      - name: Publish video and real still poster
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/videos/juma-hero-latest.mp4 assets/images/juma-hero-latest-poster.jpg
          if git diff --cached --quiet; then
            echo 'Video assets already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare uploaded Juma video for homepage hero'
          git pull --rebase origin main
          git push origin HEAD:main
