name: Prepare new Juma homepage hero video

on:
  push:
    branches: [main]
    paths:
      - 'assets/videos/20261105_174122.mov'
      - '.github/workflows/convert-hero-juma-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert newest Juma video for browser autoplay
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='assets/videos/20261105_174122.mov'
          TARGET='assets/videos/juma-hero-latest.mp4'
          POSTER='assets/images/juma-hero-latest-poster.jpg'
          test -s "$SOURCE"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration:stream_side_data=rotation -of json "$SOURCE"
          # Let FFmpeg apply camera rotation, keep the frame intact and use a
          # fast-start, muted-loop friendly H.264 without unnecessary audio.
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$SOURCE" \
            -map 0:v:0 -an \
            -vf 'fps=24,scale=960:960:force_original_aspect_ratio=decrease:force_divisible_by=2,setsar=1' \
            -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p \
            -metadata:s:v:0 rotate=0 -movflags +faststart "$TARGET"
          test -s "$TARGET"
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 2 -i "$TARGET" \
            -frames:v 1 -vf 'scale=1000:1000:force_original_aspect_ratio=decrease' -q:v 3 "$POSTER"
          test -s "$POSTER"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,side_data_list:format=duration -of json "$TARGET"
          ls -lh "$SOURCE" "$TARGET" "$POSTER"
      - name: Publish video and real still poster
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/videos/juma-hero-latest.mp4 assets/images/juma-hero-latest-poster.jpg
          if git diff --cached --quiet; then
            echo 'Video assets already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare uploaded Juma video for homepage hero'
          git pull --rebase origin main
          git push origin HEAD:main
