name: Static site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check files and demo guardrails
        run: python3 scripts/check_site.py
      - name: Validate translations and JavaScript
        run: |
          node --check assets/translations.js
          node --check assets/app.js
          node --check assets/experience-carousel.js
          node --check assets/juma-video.js
          node scripts/check-i18n.cjs
      - name: Build and verify localized pages
        run: |
          node scripts/build-locales.cjs
          node scripts/check-seo.cjs
          node --check assets/ecm-bootstrap.js
          node scripts/check-ecm.cjs
