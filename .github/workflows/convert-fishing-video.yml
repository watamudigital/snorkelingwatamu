name: Publish deep-sea fishing gallery video

on:
  push:
    branches: [main]
    paths:
      - 'assets/videos/beeca5d6-bf02-4817-8b0a-31e0e42f4b5a.mov'
      - '.github/workflows/convert-fishing-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Convert uploaded fishing MOV to browser-friendly MP4
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='assets/videos/beeca5d6-bf02-4817-8b0a-31e0e42f4b5a.mov'
          TARGET='assets/videos/fishing-portrait.mp4'
          test -s "$SOURCE"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          # MOV can store sideways pixels with a 90-degree display matrix.
          # Allow FFmpeg's default automatic rotation to honor that matrix.
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height:stream_side_data=rotation -of json "$SOURCE"
          # Produce a real 9:16 portrait video, without cropping the footage.
          # Footage which is natively landscape receives side padding.
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$SOURCE" -map 0:v:0 -map '0:a:0?' \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=0x0b4b55,setsar=1" \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -metadata:s:v:0 rotate=0 \
            -c:a aac -b:a 96k -movflags +faststart "$TARGET"
          test -s "$TARGET"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height:stream_side_data=rotation -of json "$TARGET" >/tmp/fishing-video.json
          python3 - <<'PY'
          import json
          with open('/tmp/fishing-video.json', encoding='utf-8') as f:
              v=json.load(f)['streams'][0]
          assert v['width'] == 720 and v['height'] == 1280, f"Expected portrait video: {v}"
          rotations = [x['rotation'] for x in v.get('side_data_list', []) if 'rotation' in x]
          assert all(float(r)==0 for r in rotations), rotations
          print("Validated fishing MP4:", v['width'], "x", v['height'], "rotation", rotations or "none")
          PY
      - name: Commit browser-friendly fishing video
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/videos/fishing-portrait.mp4
          if git diff --cached --quiet; then
            echo "MP4 already up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Publish upright portrait fishing video'
          git push origin HEAD:main
